services:
  - type: web
    name: touchline
    runtime: python
    rootDir: src
    buildCommand: bash render-build.sh
    startCommand: python -m football.cli serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FOOTBALL_SIGNING_SECRET
        generateValue: true
